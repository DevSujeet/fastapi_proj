version: "3.8"

services:
  db:
    image: postgres:latest
    container_name: postgres_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data  # Persistent volume for DB data

  app:
    # context: .
    # dockerfile: Dockerfile.dev  # <---- This tells Docker Compose to use the Dockerfile.dev in the same directory
    build: .  # <---- This tells Docker Compose to use the Dockerfile(default name) in the same directory
    container_name: fastapi_app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/vodafone

volumes:
  postgres_data:
